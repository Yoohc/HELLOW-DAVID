<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎱</text></svg>">
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button id="theme-btn"><i class="fa-solid fa-moon"></i></button>
        </div>
        <header>
            <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Lotto Number Generator</h1>
        </header>
    
        <main>
            <div class="lotto-card">
                <div class="numbers-container">
                    <!-- Numbers will be generated here -->
                </div>
                <button id="generate-btn">Generate Numbers</button>
            </div>

            <div class="contact-card">
                <h2><i class="fa-solid fa-handshake"></i> 제휴 문의</h2>
                <form action="https://formspree.io/f/maqkjypa" method="POST">
                    <div class="form-group">
                        <label for="name">성함</label>
                        <input type="text" id="name" name="name" required placeholder="홍길동">
                    </div>
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="_replyto" required placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label for="company">회사/단체명</label>
                        <input type="text" id="company" name="company" placeholder="회사명을 입력해주세요">
                    </div>
                    <div class="form-group">
                        <label for="message">문의 내용</label>
                        <textarea id="message" name="message" required placeholder="문의하실 내용을 입력해주세요"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">문의하기</button>
                </form>
            </div>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
